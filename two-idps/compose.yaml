services:

  canton:
    container_name: canton
    image: europe-docker.pkg.dev/da-images/public/docker/canton-base:3.4.8
    volumes:
      - ./configs/:/app/configs/
    entrypoint: /app/bin/canton
    command: sandbox --config /app/configs/canton.conf --log-profile container
    ports:
      - 6865:6865
      - 6866:6866
      - 7575:7575

  mockauth1:
    container_name: mockauth1
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    volumes:
      - ./mock-oauth2-server-1.json:/host/mock-oauth2-server-1.json
    environment:
      - LOG_LEVEL=DEBUG
      - JSON_CONFIG_PATH=/host/mock-oauth2-server-1.json
    ports:
      - 8080:8080

  mockauth2:
    container_name: mockauth2
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    volumes:
      - ./mock-oauth2-server-2.json:/host/mock-oauth2-server-2.json
    environment:
      - LOG_LEVEL=DEBUG
      - JSON_CONFIG_PATH=/host/mock-oauth2-server-2.json
    ports:
      - 8081:8080

  console:
    container_name: console
    image: europe-docker.pkg.dev/da-images/public/docker/canton-base:3.4.8
    profiles:
      - console
    volumes:
      - ./configs:/canton/host/configs
    entrypoint: /app/bin/canton
    command: >
      --no-tty
      --config "/canton/host/configs/console.conf"
      --log-profile container
      --log-level-root WARN
